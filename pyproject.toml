[project]
name = "bodhan-lesson-agent"
version = "0.1.0"
description = "Agentic pipeline that converts scanned textbook chapters into translated, narrated lessons."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "httpx>=0.28",
    "tenacity>=9.0",
    "jinja2>=3.1",
    "opencv-python>=4.10",
    "pillow>=11.0",
    "pymupdf>=1.26",
    "edge-tts>=7.0",
    "typer>=0.15",
    "python-dotenv>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-httpx>=0.34",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
bodhan = "bodhan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bodhan"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/bodhan/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["bodhan"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
